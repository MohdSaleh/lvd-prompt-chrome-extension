<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LVD Compiler - Original UI (Before)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #121214;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #71717a;
      margin-bottom: 12px;
    }
    .preview-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px;
    }
    .simulated-chat-input {
      background: #212124;
      border: 1px solid #3f3f46;
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }
    .prompt-text {
      font-size: 15px;
      color: #f4f4f5;
      min-height: 48px;
    }
    iframe {
      border: 1px solid #27272a;
      border-radius: 8px;
      width: 320px;
      height: 280px;
      background: #09090b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <div class="section-title">Original Extension Popup (Before Redesign)</div>
      <iframe src="popup.html"></iframe>
    </div>

    <div>
      <div class="section-title">Original In-Page Pill Suggestion Bar (Before Redesign)</div>
      <div class="preview-card">
        <div class="simulated-chat-input">
          <div id="lvd-suggestion-bar">
            <button class="lvd-pill" type="button">
              <span class="lvd-term">learn</span>
              <span class="lvd-arrow">→</span>
              <span class="lvd-rephrase">adapt in context</span>
            </button>
            <button class="lvd-pill" type="button">
              <span class="lvd-term">adapt</span>
              <span class="lvd-arrow">→</span>
              <span class="lvd-rephrase">Modify behavior based on newly available context or results</span>
            </button>
            <button class="lvd-pill" type="button">
              <span class="lvd-term">think</span>
              <span class="lvd-arrow">→</span>
              <span class="lvd-rephrase">perform multi-step inference</span>
            </button>
          </div>
          <div class="prompt-text">
            I want the AI to learn from the errors and think step by step to adapt the plan...
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
